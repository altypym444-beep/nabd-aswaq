name: Refresh market snapshots
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch free snapshots
        run: |
          set -e
          UA='Mozilla/5.0 (compatible; NabdAswaqBot/1.0)'
          curl -fsSL -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/CL=F?interval=1d&range=5d" -o /tmp/oil.json
          curl -fsSL -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/GC=F?interval=1d&range=5d" -o /tmp/gold.json
          curl -fsSL -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=1d&range=5d" -o /tmp/spx.json
          curl -fsSL -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/%5EIXIC?interval=1d&range=5d" -o /tmp/ndx.json
          curl -fsSL -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?interval=1d&range=5d" -o /tmp/aapl.json
          curl -fsSL -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/MSFT?interval=1d&range=5d" -o /tmp/msft.json
          curl -fsSL "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o /tmp/cal.json
          curl -fsSL "https://api.worldbank.org/v2/country/USA;CHN;DEU;JPN;GBR;SAU/indicator/FP.CPI.TOTL.ZG?format=json&mrnev=1&per_page=20" -o /tmp/inf.json
          curl -fsSL "https://api.worldbank.org/v2/country/USA;CHN;DEU;JPN;GBR;SAU/indicator/NY.GDP.MKTP.CD?format=json&mrnev=1&per_page=20" -o /tmp/gdp.json
          curl -fsSL "https://stats.bis.org/api/v1/data/WS_CBPOL/D.US+XM+GB+JP+CN+SA?lastNObservations=1&format=csv" -o /tmp/bis.csv
          curl -fsSL "https://open.er-api.com/v6/latest/USD" -o /tmp/fx.json
          curl -fsSL "https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT" -o /tmp/btc.json
          python3 << 'PY'
          import json, csv, io, datetime, pathlib
          root = pathlib.Path('.')
          def yahoo(path, out):
            d=json.load(open(path))
            r=d['chart']['result'][0]; m=r['meta']; q=r['indicators']['quote'][0]; ts=r.get('timestamp') or []; closes=q.get('close') or []
            hist=[{'t':t,'c':c} for t,c in zip(ts,closes) if c is not None]
            json.dump({
              'source':'Yahoo Finance','sourceUrl':'https://finance.yahoo.com','symbol':m.get('symbol'),
              'name':m.get('shortName') or m.get('symbol'),'price':m.get('regularMarketPrice'),
              'changePercent':m.get('regularMarketChangePercent'),'currency':m.get('currency') or 'USD',
              'history':hist[-40:],'asOf':datetime.datetime.utcfromtimestamp(m['regularMarketTime']).isoformat()+'Z' if m.get('regularMarketTime') else datetime.datetime.utcnow().isoformat()+'Z'
            }, open(out,'w'), ensure_ascii=False)
          yahoo('/tmp/oil.json','bake-oil.json')
          yahoo('/tmp/gold.json','bake-gold.json')
          yahoo('/tmp/spx.json','bake-spx.json')
          yahoo('/tmp/ndx.json','bake-ndx.json')
          yahoo('/tmp/aapl.json','bake-aapl.json')
          yahoo('/tmp/msft.json','bake-msft.json')
          cal=json.load(open('/tmp/cal.json'))
          now=datetime.datetime.utcnow().timestamp()
          events=[]
          for e in cal:
            try:
              t=datetime.datetime.fromisoformat(e['date']).timestamp()
            except Exception:
              continue
            if t >= now - 6*3600:
              events.append({'title':e.get('title'),'country':e.get('country'),'date':e.get('date'),'impact':e.get('impact'),'forecast':e.get('forecast') or '','previous':e.get('previous') or ''})
          json.dump({'source':'Forex Factory calendar mirror (nfs.faireconomy.media)','sourceUrl':'https://www.forexfactory.com/calendar','events':events[:40],'asOf':datetime.datetime.utcnow().isoformat()+'Z'}, open('bake-calendar.json','w'), ensure_ascii=False)
          fx=json.load(open('/tmp/fx.json')); rates=fx.get('rates') or {}
          json.dump({'source':'ExchangeRate-API (open.er-api.com)','sourceUrl':'https://www.exchangerate-api.com','base':'USD','pairs':{'EUR/USD':1/rates['EUR'],'GBP/USD':1/rates['GBP'],'USD/JPY':rates['JPY'],'USD/SAR':rates['SAR'],'USD/AED':rates['AED'],'USD/CHF':rates['CHF']},'asOf':fx.get('time_last_update_utc')}, open('bake-fx.json','w'), ensure_ascii=False)
          btc=json.load(open('/tmp/btc.json'))
          json.dump({'source':'Binance','sourceUrl':'https://www.binance.com','symbol':'BTC','name':'Bitcoin','price':float(btc['lastPrice']),'changePercent':float(btc['priceChangePercent']),'currency':'USD','asOf':datetime.datetime.utcnow().isoformat()+'Z'}, open('bake-crypto.json','w'), ensure_ascii=False)
          name={'USA':'الولايات المتحدة','CHN':'الصين','DEU':'ألمانيا','JPN':'اليابان','GBR':'بريطانيا','SAU':'السعودية'}
          by={k:{'code':k,'name':v} for k,v in name.items()}
          for row in (json.load(open('/tmp/inf.json'))[1] or []):
            if row and row.get('value') is not None and row['countryiso3code'] in by:
              by[row['countryiso3code']].update(inflation=float(row['value']),inflationYear=row['date'],inflationSource='World Bank (FP.CPI.TOTL.ZG)')
          for row in (json.load(open('/tmp/gdp.json'))[1] or []):
            if row and row.get('value') is not None and row['countryiso3code'] in by:
              by[row['countryiso3code']].update(gdp=float(row['value']),gdpYear=row['date'],gdpSource='World Bank (NY.GDP.MKTP.CD)')
          rate_map={'US':'USA','XM':'DEU','EA':'DEU','DE':'DEU','GB':'GBR','JP':'JPN','CN':'CHN','SA':'SAU'}
          def parse_csv(line):
            out=[]; cur=''; q=False
            for ch in line:
              if ch=='"': q=not q; continue
              if ch==',' and not q: out.append(cur); cur=''; continue
              cur+=ch
            out.append(cur); return out
          lines=open('/tmp/bis.csv',encoding='utf-8',errors='ignore').read().strip().splitlines()
          for line in lines[1:]:
            cols=parse_csv(line)
            if len(cols)<12: continue
            iso=rate_map.get(cols[1]);
            if not iso or iso not in by or cols[11]=='': continue
            by[iso].update(policyRate=float(cols[11]),policyRateDate=cols[10],policyRateSource='BIS Central Bank Policy Rates (WS_CBPOL)')
          json.dump({'source':'World Bank + BIS','sourceUrl':'https://data.worldbank.org / https://data.bis.org','countries':list(by.values()),'asOf':datetime.datetime.utcnow().isoformat()+'Z','notes':'التضخم والناتج من البنك الدولي؛ الفائدة من BIS.'}, open('bake-indicators.json','w'), ensure_ascii=False)
          print('snapshots written')
          PY
      - name: Commit snapshots
        run: |
          git config user.name "nabd-aswaq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bake-*.json || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh market snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
